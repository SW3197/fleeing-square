<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Le carré qui fuit</title>

        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #f2f2f2;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .card{
                width: 420px;
                background: white;
                border-radius: 14px;
                padding: 18px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.10);
            }
            h1{
                margin: 0 0 6px 0;
                font-size: 20px;
            }
            p{
                margin: 0 0 12px 0;
                opacity: 0.8;
                line-height: 1.4;
                font-size: 14px;
            }
            .hud{
                display: flex;
                gap: 10px;
                margin-top: 10px;
            }
            .pill{
                flex: 1;
                background: #f7f7f7;
                border-radius: 12px;
                padding: 10px;
                text-align: center;
                font-weight: 700;
            }
            .pill span{
                font-weight: 800;
            }
            .arena{
                position: relative;
                margin-top: 14px;
                height: 320px;
                background: #f7f7f7;
                border-radius: 14px;
                overflow: hidden;
                border: 1px solid #e6e6e6;
            }
            .square{
                position: absolute;
                left: 20px;
                top: 20px;
                width: 60px;
                height: 60px;
                border-radius: 12px;
                background: #2d6cdf;
                cursor: pointer;
                user-select: none;
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgba(255,255,255,0.9);
                font-weight: 800;
                transition: transform 80ms ease;
            }
            .square:active{
                transform: scale(0.95);
            }
            .actions{
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }
            button{
                flex: 1;
                border: none;
                border-radius: 10px;
                padding: 10px 12px;
                cursor: pointer;
                font-weight: 800;
                background: #2d6cdf;
                color: white;
            }
            .ghost{
                background: #e9e9e9;
                color: #333;
            }
            .msg{
                margin-top: 10px;
                font-size: 14px;
                opacity: 0.85;
                min-height: 20px;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h1>Le carré qui fuit</h1>
            <p>Clique le carré le plus de fois possible en <b>15 secondes</b>. Il bouge à chaque clic.</p>

            <div class="hud">
                <div class="pill">Score : <span id="score">0</span></div>
                <div class="pill">Temps : <span id="time">15</span></div>
            </div>

            <div class="arena" id="arena">
                <div class="square" id="square">GO</div>
            </div>

            <div class="actions">
                <button id="startBtn">Démarrer</button>
                <button id="resetBtn" class="ghost">Reset</button>
            </div>

            <div class="msg" id="msg"></div>
        </div>

        <script>
            const arena = document.getElementById("arena");
            const square = document.getElementById("square");
            const scoreEl = document.getElementById("score");
            const timeEl = document.getElementById("time");
            const msgEl = document.getElementById("msg");
            const startBtn = document.getElementById("startBtn");
            const resetBtn = document.getElementById("resetBtn");

            let score = 0;
            let timeLeft = 15;
            let timerId = null;
            let playing = false;

            function randInt(min, max){
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function randColor(){
                const colors = ["#2d6cdf", "#ff6b6b", "#6bcb77", "#ffd93d", "#845ec2", "#00c9a7", "#ff9671"];
                return colors[randInt(0, colors.length - 1)];
            }

            function moveSquare(){
                const arenaRect = arena.getBoundingClientRect();

                const size = randInt(35, 90);
                square.style.width = size + "px";
                square.style.height = size + "px";

                const maxX = arenaRect.width - size;
                const maxY = arenaRect.height - size;

                const x = randInt(0, Math.max(0, Math.floor(maxX)));
                const y = randInt(0, Math.max(0, Math.floor(maxY)));

                square.style.left = x + "px";
                square.style.top = y + "px";

                square.style.backgroundColor = randColor();
            }

            function updateHub(){
                scoreEl.textContent = score;
                timeEl.textContent = timeLeft;
            }

            function startGame(){
                if (playing) return;

                score = 0;
                timeLeft = 15;
                playing = true;
                msgEl.textContent = "Go ! Clique sur le carré ^^";
                square.textContent = "GO";
                updateHub();
                moveSquare();

                timerId = setInterval(function(){
                    timeLeft -=1;
                    updateHub();

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }

            function endGame(){
                playing = false;
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                msgEl.textContent = "Terminé ! Score : " + score + " - Clique Reset pour rejouer.";
                square.textContent = "END";
            }

            function resetGame(){
                playing = false;
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                score = 0;
                timeLeft = 15;
                updateHub();
                msgEl.textContent = "";
                square.textContent = "GO";
                square.style.left = "20px";
                square.style.top = "20px";
                square.style.width = "60px";
                square.style.height = "60px";
                square.style.backgroundColor = "#2d6cdf";
            }

            square.addEventListener("click", function(){
                if (!playing) return;

                score += 1;
                updateHub();
                moveSquare();
            });

            startBtn.addEventListener("click", startGame);
            resetBtn.addEventListener("click", resetGame);

            updateHub();
        </script>
    </body>
</html>
